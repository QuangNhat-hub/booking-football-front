<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn đặt sân</title>
    <link rel="stylesheet" href="../dinhdang/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f7f9;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .page-header {
            background: linear-gradient(135deg, #008940 0%, #006b32 100%);
            color: white;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .page-header a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            cursor: pointer;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .page-header a:hover {
            opacity: 0.8;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        /* Thêm CSS dạng lưới để xếp các thẻ Card đẹp mắt */
        .booking-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .booking-card {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 16px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-top: 4px solid #008940;
        }

        .booking-card {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }

        .booking-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            transform: translateY(-2px);
        }
        .booking-card h3 { margin-top: 0; color: #333; border-bottom: 1px solid #eee; padding-bottom: 10px;}
        .status {
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .status.confirmed {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.cancelled {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.completed {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .status.no_show {
            background: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }

        .booking-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid #e0e0e0;
        }

        .booking-price {
            font-size: 20px;
            font-weight: 700;
            color: #008940;
        }

        .btn-cancel {
            background-color: #fff;
            color: #dc3545;
            border: 1px solid #dc3545;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-cancel:hover { background-color: #dc3545; color: white; }
        .btn-cancel:disabled {
            background-color: #aaa;
            cursor: not-allowed;
            border: none;
            color: white;
        }
        h2 { color: #2c3e50; margin-bottom: 10px; text-align: center; }
        #message { 
            color: #d32f2f;
            margin-top: 20px;
            padding: 16px;
            background: #ffebee;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .empty-state-subtext {
            font-size: 14px;
            color: #aaa;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid #008940;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #008940;
            font-weight: 600;
            font-size: 16px;
        }

        .filter-section {
            display: none;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #666;
        }

        .filter-btn:hover {
            border-color: #008940;
            color: #008940;
        }

        .filter-btn.active {
            background: #008940;
            color: white;
            border-color: #008940;
        }

        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header h1 {
                width: 100%;
                margin-top: 10px;
            }

            .booking-details {
                grid-template-columns: 1fr;
            }

            .booking-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .container {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="page-header">
        <a href="javascript:history.back()">← Quay lại</a>
        <h1 style="margin: 0; flex: 1; text-align: center;">Quản lý đặt sân</h1>
    </div>
    
    <div class="container">
        <h2>Lịch sử đặt sân của tôi</h2>
        <div id="message"></div>
        <div id="loading" class="loading" style="display: none;">Đang tải dữ liệu...</div>
        
        <div id="bookingList" class="booking-container">
            <p style="text-align: center; width: 100%; color: #666;">Đang kết nối để tải dữ liệu...</p>
        </div>
    </div>

    <script src="../hd/Quanlidon.js"></script>
</body>
</html>
