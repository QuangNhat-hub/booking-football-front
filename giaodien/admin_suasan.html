<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Cập Nhật Sân Bóng - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="stylesheet" href="../dinhdang/style.css" />
    <link rel="stylesheet" href="../dinhdang/style2.css" />
    <link rel="stylesheet" href="../dinhdang/style4.css" />
    <style>
        .admin-form-container { max-width: 800px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit-form { background-color: #ffc107; color: #000; padding: 12px 25px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #666; text-decoration: none; font-weight: bold; }
    </style>
  </head>
  <body style="background-color: #f4f6f9;">
    
    <header class="admin-header">
      <div class="logo">
        <h2 style="color: #ffc107; margin: 0"><i class="fas fa-edit"></i> Cập Nhật Sân Bóng</h2>
      </div>
    </header>

    <div class="container">
        <div class="admin-form-container">
            <a href="admin_index.html" class="back-link"><i class="fas fa-arrow-left"></i> Quay lại danh sách</a>
            
            <form id="editFieldForm">
                <div class="form-group">
                    <label>Tên sân bóng</label>
                    <input type="text" id="fieldName" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Địa chỉ</label>
                    <input type="text" id="address" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Mô tả chi tiết</label>
                    <textarea id="description" class="form-control" style="min-height: 100px;"></textarea>
                </div>

                <button type="submit" class="btn-submit-form"><i class="fas fa-save"></i> Lưu Thay Đổi</button>
            </form>
        </div>
    </div>

    <script src="../hd/admin_suasan.js"></script>
  </body>
</html>
